    city: "Metropolis"
    state: "NY"
    zip: 10001
    coordinates:
      lat: 40.7128
      lng: -74.0060
  contact:
    email: "info@acme-corp.com"
    phone: "+1-555-123-4567"
    website: "https://acme-corp.com"

employees:

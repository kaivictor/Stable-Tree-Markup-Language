      last_login: 2023-12-01T10:30:00Z
      notes: |
        Alice is a senior developer.
        She leads the frontend team.
        She also contributes to open source.
  - &emp2
    id: 2
    name: "Bob \"The Builder\" Smith"
    role: "DevOps Engineer"
    skills:
      - AWS
      - Kubernetes
      - Terraform
    salary: 105000
    active: true
    start_date: 2019-06-01
    metadata:
      last_login: 2023-12-02T08:15:00Z
      notes: >
        Bob is responsible for CI/CD pipelines.
        He automates everything.
  - &emp3
    id: 3
    name: "Charlie Brown"
    role: "Designer"

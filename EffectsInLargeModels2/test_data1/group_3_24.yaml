"说明": "本STML文档演示了所有支持的特性：\n- 字符串、列表、字典、null\n- 多行文本（使用花括号）\n- 行内列表和列表行\n- 嵌套字典\n- 注释\n- 多文档（使用---分隔）\n注意：所有键和值必须用双引号包裹，缩进为偶数个空格。"

---
第三个文档: 这是第三个文档
文档编号: "3"
内容: |
  第三个文档用于演示多文档的灵活性。
  每个文档都是独立的STML结构。
复杂嵌套:
  层级1:
    层级2:
      层级3:
        层级4: 深层值
        另一个: 另一个值
      层级3b: 值
    层级2b: 值
  层级1b: 值
列表列表:
  - [内嵌列表1, 内嵌列表2, 内嵌列表3]
  - [内嵌列表A, 内嵌列表B]
  - [单独项]
混合类型: 注意：STML不支持类型混用，所以这里所有值都是字符串或null或列表或字典，但同一层级不能混用不同类型。

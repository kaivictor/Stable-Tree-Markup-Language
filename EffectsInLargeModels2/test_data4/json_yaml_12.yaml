- 第二个文档: 关于STML格式的说明
  格式特点:
    缩进: 必须为偶数个空格
    引号: 键和值都用半角双引号包裹
    多行文本: 使用{...}包裹，右花括号缩进≤键缩进
    列表: 支持行内[...]和-行
    注释: 以#开头单独一行
    null: 表示空值
    多文档: 使用---分隔
  示例:
    简单键值: 值
    嵌套字典:
      层级1:
        层级2: 深度嵌套
    行内列表:
      - 项1
      - 项2
      - 项3
    多行列表:
      - 第一项
      - 第二项
      - 第三项
    混合列表:
      - 简单字符串
      - 键1: 值1
        键2: 值2
      - 键3: null
  注意事项:
    类型混用: 不支持在字典中混合键值对和列表项
    转义字符: 引号和换行需要转义
    缩进规则: 子项缩进必须比父项多2个空格（偶数）
  常见错误:
    - 缩进使用了奇数个空格
    - 多行文本右花括号缩进过大
    - 列表项缩进不一致
    - 键或值未加引号
    - 注释行前有空格（注释必须行首）
  参考: 请严格按照规范编写STML文档

- 第三个文档: 关于宇宙的哲学思考
  引言: |
    人类在宇宙中是否孤独？
    宇宙是否有边界？
    时间是否有起点和终点？
    这些问题至今没有答案。
  观点:
    - 宇宙可能是一个无限循环的系统
    - 多元宇宙理论认为存在无数个平行宇宙
    - 模拟假说认为我们可能生活在计算机模拟中
    - 人择原理解释了为什么宇宙适合生命存在
  名言:
    卡尔·萨根: 宇宙就在我们之中，我们就是宇宙认识自身的方式。
    爱因斯坦: 宇宙最不可理解之处是它竟然是可以理解的。
    霍金: 记住要仰望星空，而不是低头看脚下。
  多行名言: |
    “宇宙的浩瀚让我们感到渺小，
    但正是这种渺小激发了探索的欲望。
    我们是由星尘组成的，
    我们的身体里含有恒星核合成的元素。
    所以，探索宇宙就是探索我们自己。”

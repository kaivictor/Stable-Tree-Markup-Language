# 这是一个非常丰富的STML文档示例
"这是一个非常丰富的STML文档": "包含多种结构"
"嵌套字典":
  "第一层":
    "第二层":
      "第三层": "深度嵌套"
      "另一个键": null
    "同级键": "值"
  "另一个第一层":
    "子键": "子值"
"多行文本示例": "这是第一行，包含一些文本。\n这是第二行，包含\"双引号\"和'单引号'。\n这是第三行，包含特殊字符：{}[]:,-等。\n这是第四行，包含换行符（实际换行）。\n这是第五行，最后一行。\n"
"行内列表": ["元素1", "元素2", "元素3", "元素4", "元素5"]
"多行列表":
  - "列表项1"
  - "列表项2"
  - "列表项3"
  - "列表项4"
  - "列表项5"
"混合列表":
  - "简单项1"
  - "简单项2"
  - "字典项1":
      "键1": "值1"
      "键2": "值2"
  - "字典项2":
      "键A": "值A"
      "键B": "值B"
      "键C": "值C"
  - "简单项3"
"包含转义": "包含\"引号\"和\\\\反斜杠以及\n换行符（但注意在单行字符串中换行符需要转义为\\\\n）"
"多文档分隔": "下面开始第二个文档"
---
# 第二个文档
"第二个文档":
  "嵌套列表":
    - ["内嵌列表1", "内嵌列表2", "内嵌列表3"]
    - "普通项"
    - ["另一个内嵌", "列表"]
  "多行文本带缩进": "  开头有空格\n    中间有更多空格\n      更多缩进\n  最后一行\n"
  "空值": null
  "列表内字典":
    - "字典1":
        "a": "b"
        "c": "d"
    - "字典2":
        "e": "f"
        "g": "h"
    - "字典3":
        "i": "j"
  # 这是第二个文档的注释
---
# 第三个文档
"第三个文档":
  "只有键": null
  "列表内字典":
    - "字典1":
        "a": "b"
    - "字典2":
        "c": "d"
    - "字典3":
        "e": "f"
    - "字典4":
        "g": "h"
  "多行文本": "这是第三个文档的多行文本。\n它包含多行。\n结束。\n"
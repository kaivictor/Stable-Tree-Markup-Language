"书籍":
  - "书名": "三体"
    "作者": "刘慈欣"
    "出版年份": "2008"
    "标签": ["科幻", "经典"]
    "简介": |
      《三体》是刘慈欣创作的系列长篇科幻小说，由《三体》、《三体Ⅱ·黑暗森林》、《三体Ⅲ·死神永生》组成。
      作品讲述了地球人类文明和三体文明的信息交流、生死搏杀及两个文明在宇宙中的兴衰历程。
    "是否借出": "否"
  - "书名": "活着"
    "作者": "余华"
    "出版年份": "1993"
    "标签": ["小说", "现实主义"]
    "简介": |
      《活着》是余华的代表作，讲述了农村人福贵悲惨的人生遭遇。
      福贵本是个阔少爷，可他嗜赌如命，终于赌光了家业，一贫如洗。
    "是否借出": "是"
  - "书名": "百年孤独"
    "作者": "加西亚·马尔克斯"
    "出版年份": "1967"
    "标签": ["魔幻现实主义", "经典"]
    "简介": |
      《百年孤独》是哥伦比亚作家加西亚·马尔克斯的代表作，也是拉丁美洲魔幻现实主义文学的代表作。
      作品描写了布恩迪亚家族七代人的传奇故事，以及加勒比海沿岸小镇马孔多的百年兴衰。
    "是否借出": null

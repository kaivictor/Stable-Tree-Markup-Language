图书馆目录:
  名称: 市立图书馆
  地址: 123 主街
  开放时间: 周一至周五 9:00-18:00
  书籍列表:
    - 标题: 百年孤独
      作者: 加西亚·马尔克斯
      出版年份: "1967"
      标签:
        - 文学
        - 魔幻现实主义
        - 经典
      摘要: |
        《百年孤独》是哥伦比亚作家加西亚·马尔克斯的代表作，
        也是拉丁美洲魔幻现实主义文学的代表作，
        被誉为"再现拉丁美洲历史社会图景的鸿篇巨著"。
    - 标题: "1984"
      作者: 乔治·奥威尔
      出版年份: "1949"
      标签:
        - 反乌托邦
        - 政治小说
        - 经典
      摘要: |
        《1984》是英国作家乔治·奥威尔创作的一部反乌托邦小说，
        描绘了一个极权统治下的未来社会。
    - 标题: 三体
      作者: 刘慈欣
      出版年份: "2008"
      标签:
        - 科幻
        - 硬科幻
        - 雨果奖
      摘要: |
        《三体》是刘慈欣创作的系列长篇科幻小说，
        讲述了地球人类文明和三体文明的信息交流、
        生死搏杀及两个文明在宇宙中的兴衰历程。
    - 标题: 红楼梦
      作者: 曹雪芹
      出版年份: "1791"
      标签:
        - 古典文学
        - 四大名著
        - 爱情
      摘要: |
        《红楼梦》是中国古典四大名著之首，
        以贾宝玉、林黛玉、薛宝钗的爱情婚姻悲剧为主线，
        描绘了一个封建大家族的兴衰。
    - 标题: 小王子
      作者: 安托万·德·圣-埃克苏佩里
      出版年份: "1943"
      标签:
        - 童话
        - 哲理
        - 经典
      摘要: |
        《小王子》是法国作家安托万·德·圣-埃克苏佩里创作的著名童话，
        以一位飞行员作为故事叙述者，
        讲述了小王子从自己星球出发前往地球的过程中所经历的各种历险。
  员工数量: null
  备注: 这是一个示例目录，包含五本经典书籍

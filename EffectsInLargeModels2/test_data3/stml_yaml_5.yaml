  "空列表": []
  "空字典": ""
  "显式null": null
  "隐式null": null
  "注释行": "# 这不是注释，是字符串"
  "多行空值": ""
---
"嵌套深度测试":
  "第一层":
    "第二层":
      "第三层":
        "第四层":
          "第五层": "到达底部"
          "另一个键": "也是底部"
      "同层键": "值"

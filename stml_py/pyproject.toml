[build-system]
requires = ["setuptools>=69", "pybind11>=2.12"]
build-backend = "setuptools.build_meta"

[project]
name = "stml"
version = "1.3.0"
description = "STML — Stable Tree Markup Language parser and serializer"
requires-python = ">=3.9"
readme = { text = "STML — Stable Tree Markup Language: a visually YAML-like plain-text data format. Provides loads/load/dumps/to_json with C++ core and Python bindings.", content-type = "text/plain" }
license = "MIT"
authors = [
    { name = "STML Authors" }
]
keywords = ["stml", "parser", "serializer", "data-format", "markup-language"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: C++",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.setuptools.packages.find]
where = ["src"]
